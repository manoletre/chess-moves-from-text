<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Annotator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desk">
    <section class="panel">
      <div class="examples" id="examples"></div>
      <label class="fen">
        <span class="fen__label">Position (FEN) the text talks about</span>
        <input id="fen" type="text" spellcheck="false" autocomplete="off" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
      </label>
      <div class="text-frame">
        <div id="text" class="text" contenteditable="plaintext-only" spellcheck="false" aria-label="Chess commentary"></div>
        <div class="loader" id="loader" role="progressbar" aria-label="Loading the model"><span></span></div>
      </div>
      <p class="legend">
        <span class="legend__group">tagger</span>
        <span class="mk mk--move mk--chosen">chosen move</span>
        <span class="mk mk--move mk--rejected">rejected</span>
        <span class="mk mk--move mk--considered">other</span>
        <span class="mk mk--fact">claim or piece on square</span>
        <span class="legend__group col-check">chess.js</span>
        <span class="col-check"><b class="v v--true">✓</b> true <b class="v v--false">✗</b> false <b class="v v--unknown">?</b> can't tell</span>
      </p>
      <section class="report" id="report" hidden aria-live="polite"></section>
    </section>

    <div class="board-frame">
      <div class="board" id="board" role="img" aria-label="Chessboard"></div>
    </div>
  </main>

  <footer>made by <a href="https://www.manoletre.com">manoletre</a> 🇨🇴</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
