<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Annotator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>The <em>Annotator</em></h1>

  <main class="desk">
    <section class="panel">
      <div class="examples" id="examples"></div>
      <div class="text-frame">
        <div id="text" class="text" contenteditable="plaintext-only" spellcheck="false" aria-label="Chess commentary"></div>
        <div class="loader" id="loader" role="progressbar" aria-label="Loading the model"><span></span></div>
      </div>
    </section>

    <div class="board-frame">
      <div class="board" id="board" role="img" aria-label="Chessboard"></div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
